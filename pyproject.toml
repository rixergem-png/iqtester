[project]
name = "iqtester"
version = "0.1.0"
description = "Banco de preguntas tipo test de CI con respuesta única y evaluación de resolvedores (reglas, LLM) con métricas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # el núcleo solo usa la librería estándar

[project.optional-dependencies]
ia = ["anthropic>=2", "pydantic>=2"]
graficos = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "mutmut>=3", "matplotlib>=3.8"]

[project.scripts]
iqtester = "iqtester.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["iqtester"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
paths_to_mutate = ["src/iqtester/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["datos/", "umbrales.json"]
